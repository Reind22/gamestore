<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар — GameStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }

:root{
  --bg:#F0F0F0; --paper:#FFFFFF; --paper-2:#FAFBFA; --hover-wash:#F0F8F0;
  --lime:#00FF00; --lime-deep:#0ECC0E; --lime-ink:#053B05; --lime-line:#C4ECC4;
  --ink:#171B17; --ink-2:#545B54; --ink-3:#969E96;
  --line:#E4E7E4; --line-2:#D8DDD8; --red:#E5484D; --red-bg:#FDEDEE; --gold:#FFD84D;
  --hdr-bg:rgba(255,255,255,.86);
  --sh-1:0 1px 2px rgba(23,27,23,.05), 0 3px 12px rgba(23,27,23,.05);
  --sh-2:0 12px 32px rgba(23,27,23,.13);
  --r-s:10px; --r-m:14px; --r-l:18px;
  --ease:cubic-bezier(.22,.75,.28,1);
}
html[data-theme="dark"]{
  --bg:#101310; --paper:#191D19; --paper-2:#1E231E; --hover-wash:#1C2A1C;
  --lime:#3DFF3D; --lime-deep:#2FE22F; --lime-ink:#052B05; --lime-line:#2A4A2A;
  --ink:#E8ECE8; --ink-2:#A8B0A8; --ink-3:#6B756B;
  --line:#262B26; --line-2:#313831; --red:#FF6369; --red-bg:#3A1E20; --gold:#FFD84D;
  --hdr-bg:rgba(20,24,20,.86);
  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.25);
  --sh-2:0 12px 32px rgba(0,0,0,.5);
}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:radial-gradient(1100px 500px at 85% -8%, rgba(0,255,0,.045), transparent 62%), var(--bg);
  color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  transition:background .3s, color .3s;
}
a{color:inherit;text-decoration:none}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
img,svg{display:block}
:focus-visible{outline:2.5px solid var(--lime-deep);outline-offset:2px;border-radius:6px}
.money{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.4px}

/* Шапка общая (компактная версия) */
.hdr{position:sticky;top:0;z-index:130;background:var(--hdr-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:background .3s}
.hdr::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent 0%,var(--lime) 18%,var(--lime) 82%,transparent 100%);opacity:.5}
.hdr__in{max-width:1400px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;border-radius:12px}
.brand__mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,#7DFF7D 0%,var(--lime) 42%,#00C400 100%);display:grid;place-items:center;box-shadow:0 3px 14px rgba(0,220,60,.4)}
.brand__mark svg{width:22px;height:22px}
.brand__name{font-size:21px;font-weight:800;letter-spacing:-.7px;background:linear-gradient(120deg,#00D400,#00FF40 55%,#00C800);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand__name small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.24em;color:var(--ink-3);-webkit-text-fill-color:var(--ink-3);margin-top:2px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{padding:10px 15px;border-radius:11px;font-size:14.5px;font-weight:700;color:var(--ink-2);transition:.16s}
.nav a:hover{color:var(--ink);background:var(--hover-wash)}
.nav a.on{color:var(--lime-deep)}
.find{flex:1;max-width:430px;margin-left:auto;position:relative}
.find input{width:100%;height:46px;padding:0 18px;border:1.5px solid var(--line-2);border-radius:13px;background:var(--paper);font-size:14px}
.find input:focus{outline:none;border-color:var(--lime-deep)}
.acts{display:flex;align-items:center;gap:9px;flex-shrink:0}
.knob{position:relative;width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--paper);display:grid;place-items:center;color:var(--ink-2);transition:.18s}
.knob svg{width:19px;height:19px}
.knob:hover{border-color:var(--lime-deep);color:var(--lime-deep);background:var(--hover-wash)}
.knob .pip{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--lime-deep);color:#fff;border:2.5px solid var(--paper);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.knob .pip:empty,.knob .pip[data-zero]{display:none}
.btn-go{height:44px;padding:0 22px;border-radius:13px;background:linear-gradient(140deg,#5CFF5C,var(--lime) 45%,#00D400);color:var(--lime-ink);font-size:14.5px;font-weight:800;box-shadow:0 4px 16px rgba(0,220,60,.38)}
.btn-burger{display:none}
.seg{display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line-2);border-radius:13px;padding:3px;gap:2px;height:44px}
.seg__btn{min-width:38px;height:36px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink-3);transition:.16s}
.seg__btn svg{width:17px;height:17px}
.seg__btn.on{background:var(--hover-wash);color:var(--lime-deep);box-shadow:inset 0 0 0 1.5px var(--lime-line)}
.seg--theme .seg__btn{min-width:44px;width:44px;padding:0}

.veil{position:fixed;inset:0;z-index:190;background:rgba(12,16,12,.5);opacity:0;pointer-events:none;transition:.26s}
.veil.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;z-index:200;width:min(100vw,360px);height:100dvh;background:var(--paper);transform:translateX(105%);transition:transform .34s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet__top{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.sheet__ttl{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.sheet__x{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--paper-2);display:grid;place-items:center}
.sheet__body{flex:1;overflow-y:auto;padding:16px}
.sheet__prefs{display:flex;flex-direction:column;gap:12px;padding:4px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sheet__prefs .seg{width:100%;height:48px}
.sheet__prefs .seg__btn{flex:1}

/* ── СТРАНИЦА ТОВАРА ── */
.frame{max-width:1400px;margin:0 auto;padding:22px 26px 64px}
.crumb{
  display:flex;align-items:center;gap:8px;margin-bottom:18px;
  font-size:13px;font-weight:700;color:var(--ink-3);
}
.crumb a{color:var(--ink-2);transition:.15s}
.crumb a:hover{color:var(--lime-deep)}
.crumb .sep{opacity:.5}

.layout{
  display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
  gap:30px;align-items:start;
}

/* Галерея (как в Steam: большое окно + миниатюры) */
.gal{
  background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-1);overflow:hidden;
}
.gal__main{
  position:relative;aspect-ratio:16/9;
  background:#0A0A0A;
  display:grid;place-items:center;
  overflow:hidden;
}
.gal__main .stage{
  position:absolute;inset:0;
  display:grid;place-items:center;
}
.gal__main .stage .emoji{
  font-size:120px;
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.5));
}
.gal__main .stage.video::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(60% 60% at 50% 45%, transparent, rgba(0,0,0,.5)),
    linear-gradient(180deg, transparent 62%, rgba(0,0,0,.75) 100%);
}
.playbtn{
  position:relative;z-index:2;
  width:74px;height:74px;border-radius:50%;
  background:rgba(255,255,255,.16);
  border:2px solid rgba(255,255,255,.55);
  display:grid;place-items:center;
  backdrop-filter:blur(6px);
  transition:.2s var(--ease);
}
.playbtn:hover{transform:scale(1.1);background:rgba(0,255,0,.3);border-color:var(--lime)}
.playbtn svg{width:30px;height:30px;color:#fff;margin-left:4px}
.dur{
  position:absolute;bottom:12px;right:14px;z-index:2;
  padding:4px 10px;border-radius:8px;
  background:rgba(0,0,0,.6);color:#fff;
  font-family:'JetBrains Mono';font-size:11.5px;font-weight:600;
  backdrop-filter:blur(3px);
}
.gal__thumbs{
  display:flex;gap:9px;padding:12px;
  overflow-x:auto;scrollbar-width:thin;
}
.gal__th{
  position:relative;flex-shrink:0;
  width:118px;aspect-ratio:16/10;border-radius:10px;
  background:var(--paper-2);
  border:2px solid transparent;
  display:grid;place-items:center;
  cursor:pointer;overflow:hidden;
  transition:border-color .18s;
}
.gal__th.on{border-color:var(--lime-deep)}
.gal__th .mini{font-size:34px}
.gal__th .playmini{
  width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.2);
  display:grid;place-items:center;
}
.gal__th .playmini svg{width:12px;height:12px;color:#fff}
.gal__th .tdur{
  position:absolute;bottom:5px;right:6px;
  font-family:'JetBrains Mono';font-size:9px;color:#fff;
  background:rgba(0,0,0,.6);padding:2px 5px;border-radius:4px;
}
.gal__grad{
  position:absolute;inset:0;
  opacity:.9;
}

/* Инфо-колонка */
.info h1{
  font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.2;
  margin-bottom:6px;
}
.info .platform{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);
  background:var(--paper);border:1px solid var(--line-2);
  padding:4.5px 11px;border-radius:8px;
  margin-bottom:14px;
}
.meta{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  margin-bottom:16px;
  font-size:13px;font-weight:700;color:var(--ink-2);
}
.meta .stars{color:var(--gold);font-size:15px;letter-spacing:1.5px}
.meta a{color:var(--ink-3);border-bottom:1px dashed var(--line-2)}
.genres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.genre{
  font-size:11.5px;font-weight:800;
  padding:5px 12px;border-radius:99px;
  background:var(--hover-wash);color:var(--lime-deep);
  border:1px solid var(--lime-line);
}

.buybox{
  background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  padding:20px;
  margin-bottom:18px;
}
.price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.price-now{font-size:32px;color:var(--lime-deep);font-weight:600}
.price-old{font-size:17px;color:var(--ink-3);text-decoration:line-through}
.off{
  display:inline-block;margin-left:8px;
  background:var(--red);color:#fff;
  font-size:12px;font-weight:800;
  padding:3px 9px;border-radius:7px;
  vertical-align:middle;
}
.btn-buy{
  width:100%;height:52px;border-radius:14px;
  background:linear-gradient(140deg,#5CFF5C,var(--lime) 45%,#00D400);
  color:var(--lime-ink);
  font-size:16px;font-weight:800;letter-spacing:.01em;
  box-shadow:0 6px 20px rgba(0,220,60,.4), inset 0 1px 0 rgba(255,255,255,.5);
  transition:.18s var(--ease);
  margin-top:14px;
}
.btn-buy:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,220,60,.5)}
.btn-wish{
  width:100%;height:46px;border-radius:12px;
  border:1.5px solid var(--line-2);background:var(--paper-2);
  color:var(--ink-2);font-size:14px;font-weight:800;
  transition:.16s;
  margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-wish:hover{border-color:var(--gold);color:#C89B00}
.btn-wish.on{background:#FFF7DC;border-color:var(--gold);color:#7A5A00}
html[data-theme="dark"] .btn-wish.on{background:#2A2510}
.usd-note{
  display:flex;align-items:center;gap:7px;
  font-size:11.5px;font-weight:600;color:var(--ink-3);
  margin-top:12px;justify-content:center;
}

.features{
  background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-l);
  padding:20px;margin-bottom:18px;
}
.features h3{font-size:15px;font-weight:800;margin-bottom:12px}
.features ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.features li{
  display:flex;align-items:flex-start;gap:10px;
  font-size:13.5px;font-weight:600;color:var(--ink-2);
}
.features li svg{width:17px;height:17px;flex-shrink:0;color:var(--lime-deep);margin-top:1px}

.guar{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;
}
.g-card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);
  padding:14px;display:flex;align-items:center;gap:11px;
  font-size:12.5px;font-weight:700;color:var(--ink-2);
}
.g-card svg{width:22px;height:22px;color:var(--lime-deep);flex-shrink:0}

.desc-box{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
  padding:22px;
}
.desc-box h3{font-size:16px;font-weight:800;margin-bottom:12px}
.desc-box p{
  font-size:14.5px;line-height:1.7;color:var(--ink-2);font-weight:500;
}

/* Похожие */
.similar{margin-top:44px}
.similar h2{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-bottom:16px}
.sim-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}
.item{position:relative;background:var(--paper);border:1.5px solid transparent;border-radius:var(--r-m);box-shadow:var(--sh-1);overflow:hidden;cursor:pointer;transition:.24s var(--ease)}
.item:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(0,170,50,.16);border-color:var(--lime-line)}
.item__pic{position:relative;aspect-ratio:16/10;background:var(--hover-wash);display:grid;place-items:center;overflow:hidden}
.item__pic .capsule{width:38%;aspect-ratio:600/900;object-fit:cover;border-radius:0 8px 8px 0;box-shadow:4px 0 18px rgba(0,0,0,.35);transform:translateX(-8%)}
.item__glyph{font-size:46px;transition:transform .32s}
.item:hover .item__glyph{transform:scale(1.12)}
.item__plat{position:absolute;left:10px;bottom:10px;font-size:10px;font-weight:800;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.94);color:#545B54}
.tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:4.5px 10px;border-radius:8px}
.tag--new{background:var(--lime);color:var(--lime-ink)}
.tag--hot{background:var(--red);color:#fff}
.tag--cut{background:var(--red);color:#fff}
.star{position:absolute;top:9px;right:9px;z-index:3;width:33px;height:33px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:16.5px;color:#889488;transition:.2s}
.star:hover{transform:scale(1.14);background:#FFF7DC}
.star.on{background:var(--gold);color:#7A5A00}
.item__info{padding:13px 14px 14px}
.item__name{font-size:13.5px;font-weight:800;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;margin-bottom:6px}
.item:hover .item__name{color:var(--lime-deep)}
.item__sub{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item__buy{display:flex;align-items:flex-end;justify-content:space-between}
.price__now{font-size:17px;color:var(--lime-deep)}
.tocart{width:36px;height:36px;border-radius:11px;background:var(--hover-wash);color:var(--lime-deep);display:grid;place-items:center;transition:.18s}
.tocart svg{width:16px;height:16px}
.tocart:hover{background:var(--lime);color:var(--lime-ink)}

.notfound{
  text-align:center;padding:100px 20px;
}
.notfound h2{font-size:24px;font-weight:800;margin-bottom:10px}
.notfound p{color:var(--ink-3);font-weight:600;margin-bottom:20px}

.ftr{border-top:1px solid var(--line);background:var(--paper);margin-top:10px}
.ftr__in{max-width:1400px;margin:0 auto;padding:34px 26px;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.ftr__brand{display:flex;align-items:center;gap:9px}
.ftr__brand .brand__mark{width:30px;height:30px;border-radius:9px}
.ftr__brand .brand__mark svg{width:16px;height:16px}
.ftr__brand b{font-size:15px;font-weight:800;color:var(--lime-deep)}
.ftr__note{font-size:12.5px;color:var(--ink-3);font-weight:600}
.ftr__nav{display:flex;gap:22px;flex-wrap:wrap}
.ftr__nav a{font-size:13px;font-weight:700;color:var(--ink-2)}
.ftr__nav a:hover{color:var(--lime-deep)}
.toast{position:fixed;left:50%;bottom:28px;z-index:400;translate:-50% 16px;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:700;box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:.28s}
.toast.show{opacity:1;translate:-50% 0}
.toast .s{color:var(--gold);font-size:15px}

@media (max-width:1040px){
  .nav{display:none}
  .layout{grid-template-columns:1fr;gap:22px}
  .sim-row{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:840px){
  .find{display:none}
  .btn-go{display:none}
  .btn-burger{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--paper);color:var(--ink-2)}
}
@media (max-width:620px){
  .frame{padding:16px 14px 52px}
  .info h1{font-size:21px}
  .price-now{font-size:27px}
  .sim-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .hdr__in{padding:11px 14px}
  .brand__name{font-size:18px}
  .brand__mark{width:35px;height:35px}
  .seg--theme,.seg--lang,.hdr .seg[role="group"][aria-label="Валюта"]{display:none}
  .guar{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr__in">
    <a class="brand" href="index.html">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#053B05" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 11.5h4M8 9.5v4"/>
          <circle cx="15.2" cy="10.7" r=".9" fill="#053B05" stroke="none"/>
          <circle cx="17.8" cy="12.7" r=".9" fill="#053B05" stroke="none"/>
          <path d="M17.3 5.5H6.7a4 4 0 0 0-3.97 3.56c-.27 2.1-.45 4.3-.45 5.5 0 2.62 1.6 3.97 3.86 3.97 1.28 0 2.23-.56 3-1.32l.9-.9a2.6 2.6 0 0 1 3.9.02l.88.9c.78.76 1.72 1.3 3 1.3 2.26 0 3.86-1.35 3.86-3.97 0-1.2-.18-3.4-.45-5.5A4 4 0 0 0 17.3 5.5z"/>
        </svg>
      </span>
      <span class="brand__name">GameStore<small data-i18n="brandSub">ЭКСКЛЮЗИВНЫЕ АККАУНТЫ</small></span>
    </a>

    <nav class="nav" aria-label="Разделы">
      <a href="index.html" data-i18n="navHome">Главная</a>
      <a class="on" href="catalog.html" data-i18n="navCatalog">Каталог</a>
      <a href="#" data-i18n="navHelp">Помощь</a>
    </nav>

    <div class="find">
      <input type="search" placeholder="Найти…" data-i18n-ph="searchPh" aria-label="Поиск">
    </div>

    <div class="acts">
      <div class="seg seg--theme" role="group" aria-label="Тема">
        <button class="seg__btn on" data-set-theme="light" aria-label="Светлая тема">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
        </button>
        <button class="seg__btn" data-set-theme="dark" aria-label="Тёмная тема">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.6 8.6 0 1 0 10.8 10.8z"/></svg>
        </button>
      </div>
      <div class="seg seg--lang" role="group" aria-label="Язык">
        <button class="seg__btn on" data-set-lang="ru">RU</button>
        <button class="seg__btn" data-set-lang="en">EN</button>
      </div>
      <div class="seg" role="group" aria-label="Валюта">
        <button class="seg__btn on" data-set-cur="USD">$</button>
        <button class="seg__btn" data-set-cur="RUB">₽</button>
        <button class="seg__btn" data-set-cur="EUR">€</button>
      </div>
      <button class="knob" aria-label="Желаемое">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.5-1.5 2-3.1 2-4.6A4.4 4.4 0 0 0 16.6 5c-1.7 0-3 .9-4.6 2.6C10.4 5.9 9.1 5 7.4 5A4.4 4.4 0 0 0 3 9.4c0 1.5.5 3.1 2 4.6l7 7z"/></svg>
        <span class="pip" id="heartPip" data-zero></span>
      </button>
      <button class="knob" aria-label="Корзина">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9.3" cy="19.8" r="1.5"/><circle cx="17" cy="19.8" r="1.5"/><path d="M3.2 4h2.4l2.2 11.1a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L21.3 8H6.1"/></svg>
        <span class="pip" data-zero>0</span>
      </button>
      <button class="btn-go" data-i18n="login">Войти</button>
      <button class="btn-burger" id="burger" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet__top">
    <span class="sheet__ttl" data-i18n="menu">Меню</span>
    <button class="sheet__x" id="sheetX">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>
    </button>
  </div>
  <div class="sheet__body">
    <div class="sheet__prefs">
      <div class="seg" role="group" aria-label="Язык">
        <button class="seg__btn on" data-set-lang="ru">RU — Русский</button>
        <button class="seg__btn" data-set-lang="en">EN — English</button>
      </div>
      <div class="seg" role="group" aria-label="Тема">
        <button class="seg__btn on" data-set-theme="light" data-i18n="themeLight">☀️ Светлая</button>
        <button class="seg__btn" data-set-theme="dark" data-i18n="themeDark">🌙 Тёмная</button>
      </div>
      <div class="seg" role="group" aria-label="Валюта">
        <button class="seg__btn on" data-set-cur="USD">USD $</button>
        <button class="seg__btn" data-set-cur="RUB">RUB ₽</button>
        <button class="seg__btn" data-set-cur="EUR">EUR €</button>
      </div>
    </div>
  </div>
</aside>

<div class="frame" id="page"></div>

<footer class="ftr">
  <div class="ftr__in">
    <div>
      <div class="ftr__brand">
        <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none" stroke="#053B05" stroke-width="2.1" stroke-linecap="round"><path d="M6 11.5h4M8 9.5v4"/><path d="M17.3 5.5H6.7a4 4 0 0 0-3.97 3.56c-.27 2.1-.45 4.3-.45 5.5 0 2.62 1.6 3.97 3.86 3.97 1.28 0 2.23-.56 3-1.32l.9-.9a2.6 2.6 0 0 1 3.9.02l.88.9c.78.76 1.72 1.3 3 1.3 2.26 0 3.86-1.35 3.86-3.97 0-1.2-.18-3.4-.45-5.5A4 4 0 0 0 17.3 5.5z"/></svg></span>
        <b>GameStore</b>
      </div>
      <p class="ftr__note" style="margin-top:8px">© 2026 GameStore.<br><span data-i18n="curNote">Все цены в USD.</span></p>
    </div>
    <nav class="ftr__nav">
      <a href="#" data-i18n="ftAbout">О магазине</a>
      <a href="#" data-i18n="ftWarranty">Гарантии</a>
      <a href="#" data-i18n="ftPay">Оплата</a>
      <a href="#" data-i18n="ftSupport">Поддержка</a>
    </nav>
  </div>
</footer>

<div class="toast" id="toast" role="status"><span class="s">★</span><span id="toastMsg"></span></div>

<script src="gs_data.js"></script>
<script src="gs_shared.js"></script>
<script>
(() => {
  'use strict';
  const { $, $$, lang, L, fmt, toast } = GS;

  const id = parseInt(new URLSearchParams(location.search).get('id'));
  const g = GAMES.find(x => x.id === id);
  const page = $('#page');

  if (!g){
    page.innerHTML = `
      <div class="notfound">
        <h2>${L('notFound')}</h2>
        <p>404</p>
        <a class="btn-go" href="catalog.html" style="display:inline-flex;align-items:center;padding:0 24px;text-decoration:none">${L('back')}</a>
      </div>`;
    return;
  }

  document.title = `${g.title[lang()]} — GameStore`;

  const artKey = ART_BY_ID[g.id];
  const art = artKey ? steamCapsule(STEAM_ART[artKey]) : null;
  const badge = g.badge === 'new' ? `<span class="tag tag--new" style="position:static;margin-right:8px">New</span>`
              : g.badge === 'hot' ? `<span class="tag tag--hot" style="position:static;margin-right:8px">Hot</span>` : '';

  const stars = '★'.repeat(Math.round(g.rating)) + '☆'.repeat(5 - Math.round(g.rating));

  /* Медиа: первое видео, остальные картинки */
  let mediaHTML = g.media.map((m, i) => {
    const on = i === 0 ? ' on' : '';
    if (m.type === 'video'){
      return `<div class="gal__th${on}" data-i="${i}" style="background:linear-gradient(135deg, ${g.gradient[0]}, ${g.gradient[1]})">
        <span class="playmini"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
        <span class="tdur">${m.dur}</span>
      </div>`;
    }
    return `<div class="gal__th${on}" data-i="${i}" style="background:linear-gradient(135deg, ${g.gradient[0]}CC, ${g.gradient[1]}AA)">
      <span class="mini">${m.emoji}</span>
    </div>`;
  }).join('');

  const similar = GAMES.filter(x => x.id !== g.id && (x.genres.some(x2 => g.genres.includes(x2)) || x.platform === g.platform)).slice(0, 5);

  function simCard(s){
    const ak = ART_BY_ID[s.id];
    const a = ak ? `<img class="capsule" src="${steamCapsule(STEAM_ART[ak])}" alt="" loading="lazy" onerror="this.remove()">` : '';
    const b = s.badge === 'new' ? '<span class="tag tag--new">New</span>' : s.badge === 'hot' ? '<span class="tag tag--hot">Hot</span>' : s.oldPrice ? `<span class="tag tag--cut">−${Math.round((1 - s.price / s.oldPrice) * 100)}%</span>` : '';
    return `
    <article class="item" data-game-id="${s.id}" onclick="location.href='product.html?id=${s.id}'">
      <div class="item__pic">${a}<span class="item__glyph">${s.emoji}</span>${b}<button class="star" onclick="event.stopPropagation()">☆</button><span class="item__plat">${s.platform}</span></div>
      <div class="item__info">
        <h3 class="item__name">${s.title[lang()]}</h3>
        <div class="item__sub">${s.short[lang()]}</div>
        <div class="item__buy">
          <span class="price__now money" data-usd="${s.price}">${fmt(s.price)}</span>
          <button class="tocart" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </article>`;
  }

  page.innerHTML = `
    <nav class="crumb" aria-label="Хлебные крошки">
      <a href="index.html">${L('navHome')}</a>
      <span class="sep">/</span>
      <a href="catalog.html">${L('navCatalog')}</a>
      <span class="sep">/</span>
      <span>${g.title[lang()]}</span>
    </nav>

    <div class="layout">
      <!-- Галерея -->
      <div class="gal">
        <div class="gal__main" id="galMain" style="background:linear-gradient(135deg, ${g.gradient[0]}, ${g.gradient[1]})">
          <div class="gal__grad" style="background:radial-gradient(120% 100% at 50% 0%, transparent, rgba(0,0,0,.35))"></div>
          <div class="stage video" id="stage">
            <span class="emoji">${g.media[0].emoji}</span>
          </div>
          <button class="playbtn" aria-label="Смотреть трейлер">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
          </button>
          <span class="dur">${g.media[0].dur}</span>
        </div>
        <div class="gal__thumbs" id="galThumbs">${mediaHTML}</div>
      </div>

      <!-- Инфо -->
      <div class="info">
        <h1>${g.title[lang()]} ${badge}</h1>
        <span class="platform">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 12h.01M10.5 10.5v3M9 12h3" stroke-linecap="round"/><circle cx="16.5" cy="12" r="1.2" fill="currentColor"/></svg>
          ${g.platform}
        </span>

        <div class="meta">
          <span class="stars">${stars}</span>
          <span>${g.rating} · ${g.reviews} ${L('reviews')}</span>
          <span>·</span>
          <span>${g.sold} ${L('sold')}</span>
        </div>

        <div class="genres">
          ${g.genres.map(x => `<span class="genre">${GENRES[x][lang()]}</span>`).join('')}
        </div>

        <div class="buybox">
          <div class="price-row">
            <span class="price-now money" data-usd="${g.price}">${fmt(g.price)}</span>
            ${g.oldPrice ? `<span class="price-old money" data-usd="${g.oldPrice}">${fmt(g.oldPrice)}</span><span class="off">−${Math.round((1 - g.price / g.oldPrice) * 100)}%</span>` : ''}
          </div>
          <button class="btn-buy" id="buyBtn">${L('buyNow')}</button>
          <button class="btn-wish" id="wishBtn">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.5-1.5 2-3.1 2-4.6A4.4 4.4 0 0 0 16.6 5c-1.7 0-3 .9-4.6 2.6C10.4 5.9 9.1 5 7.4 5A4.4 4.4 0 0 0 3 9.4c0 1.5.5 3.1 2 4.6l7 7z"/></svg>
            <span>${L('toWish') || 'В желаемое'}</span>
          </button>
          <div class="usd-note">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v.5M12 11v5"/></svg>
            <span>${L('curNote')}</span>
          </div>
        </div>

        <div class="features">
          <h3>${L('features') || 'Что вы получаете'}</h3>
          <ul>
            ${g.features[lang()].map(f => `<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-10.5"/></svg>${f}</li>`).join('')}
          </ul>
        </div>

        <div class="guar">
          <div class="g-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5.5v5.2c0 5 3.4 9.4 8 10.8 4.6-1.4 8-5.8 8-10.8V5.5z"/><path d="m9 12 2 2 4-4.5"/></svg>
            <span>${L('guarantee')}</span>
          </div>
          <div class="g-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2 4.5 13.5H11l-1 8.5L18.5 10H12z"/></svg>
            <span>${L('delivery')}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="desc-box" style="margin-top:26px">
      <h3>${L('desc') || 'Описание'}</h3>
      <p>${g.desc[lang()]}</p>
    </div>

    ${similar.length ? `
    <section class="similar">
      <h2>${L('similar') || 'Похожие товары'}</h2>
      <div class="sim-row">${similar.map(simCard).join('')}</div>
    </section>` : ''}
  `;

  /* ── Галерея: переключение ── */
  const stage = $('#stage');
  const main = $('#galMain');
  $$('#galThumbs .gal__th').forEach(th => th.addEventListener('click', () => {
    $$('#galThumbs .gal__th').forEach(x => x.classList.remove('on'));
    th.classList.add('on');
    const i = parseInt(th.dataset.i);
    const m = g.media[i];
    if (m.type === 'video'){
      stage.className = 'stage video';
      stage.innerHTML = `<span class="emoji">${m.emoji}</span>`;
      $('.playbtn', page).style.display = 'grid';
      $('.dur', page).textContent = m.dur;
      $('.dur', page).style.display = 'block';
    } else {
      stage.className = 'stage';
      stage.innerHTML = `<span class="emoji" style="font-size:170px">${m.emoji}</span>`;
      $('.playbtn', page).style.display = 'none';
      $('.dur', page).style.display = 'none';
    }
  }));

  /* ── Wishlist кнопка ── */
  const wishBtn = $('#wishBtn');
  const syncWish = () => {
    const on = GS.state.wish.includes(g.id);
    wishBtn.classList.toggle('on', on);
    wishBtn.querySelector('span').textContent = on ? (L('inWish') || 'В желаемом ★') : (L('toWish') || 'В желаемое');
  };
  wishBtn.addEventListener('click', () => { GS.wishToggle(g.id); syncWish(); });
  if (GS.state.wish.includes(g.id)) syncWish();

  /* ── Купить (демо) ── */
  $('#buyBtn').addEventListener('click', () => {
    toast(lang() === 'ru' ? 'Демо: здесь будет checkout' : 'Demo: checkout goes here');
  });

  /* playbtn */
  $('.playbtn', page)?.addEventListener('click', () => {
    toast(lang() === 'ru' ? 'Демо: здесь будет трейлер' : 'Demo: trailer goes here');
  });
})();
</script>
</body>
</html>
