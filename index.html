<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameStore — магазин игровых аккаунтов и ключей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   GameStore — общие стили (шапка/тема/валюта)
   v2.0 — многотабличная структура
   ═══════════════════════════════════════════ */

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }

:root{
  --bg:        #F0F0F0;
  --paper:     #FFFFFF;
  --paper-2:   #FAFBFA;
  --hover-wash:#F0F8F0;

  --lime:      #00FF00;
  --lime-deep: #0ECC0E;
  --lime-ink:  #053B05;
  --lime-line: #C4ECC4;
  --lime-glow: rgba(0,220,60,.18);

  --ink:   #171B17;
  --ink-2: #545B54;
  --ink-3: #969E96;

  --line:    #E4E7E4;
  --line-2:  #D8DDD8;
  --red:     #E5484D;
  --red-bg:  #FDEDEE;
  --gold:    #FFD84D;

  --hdr-bg:  rgba(255,255,255,.86);
  --pic-a:   #ECF7EC;
  --pic-b:   #D8EFD8;

  --sh-1: 0 1px 2px rgba(23,27,23,.05), 0 3px 12px rgba(23,27,23,.05);
  --sh-2: 0 12px 32px rgba(23,27,23,.13);

  --r-s: 10px; --r-m: 14px; --r-l: 18px;
  --ease: cubic-bezier(.22,.75,.28,1);
}
html[data-theme="dark"]{
  --bg:        #101310;
  --paper:     #191D19;
  --paper-2:   #1E231E;
  --hover-wash:#1C2A1C;

  --lime:      #3DFF3D;
  --lime-deep: #2FE22F;
  --lime-ink:  #052B05;
  --lime-line: #2A4A2A;
  --lime-glow: rgba(0,220,60,.22);

  --ink:   #E8ECE8;
  --ink-2: #A8B0A8;
  --ink-3: #6B756B;

  --line:    #262B26;
  --line-2:  #313831;
  --red:     #FF6369;
  --red-bg:  #3A1E20;
  --gold:    #FFD84D;

  --hdr-bg:  rgba(20,24,20,.86);
  --pic-a:   #1B271B;
  --pic-b:   #223022;

  --sh-1: 0 1px 2px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.25);
  --sh-2: 0 12px 32px rgba(0,0,0,.5);
}

html { scroll-behavior:smooth }
body{
  font-family:'Manrope', system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(1100px 500px at 85% -8%, rgba(0,255,0,.045), transparent 62%),
    radial-gradient(900px 460px at -10% 12%, rgba(0,255,0,.03), transparent 58%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .3s, color .3s;
}
a{color:inherit;text-decoration:none}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
img,svg{display:block}
:focus-visible{outline:2.5px solid var(--lime-deep);outline-offset:2px;border-radius:6px}
::selection{background:rgba(0,255,0,.32);color:var(--lime-ink)}
.money{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.4px}

/* ═══════════ HEADER ═══════════ */
.hdr{
  position:sticky; top:0; z-index:130;
  background:var(--hdr-bg);
  backdrop-filter:blur(14px) saturate(1.4);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);
  transition:background .3s;
}
.hdr::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
  background:linear-gradient(90deg, transparent 0%, var(--lime) 18%, var(--lime) 82%, transparent 100%);
  opacity:.5;
}
.hdr__in{
  max-width:1400px; margin:0 auto;
  padding:13px 26px;
  display:flex; align-items:center; gap:18px;
}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;padding:3px 4px 3px 2px;border-radius:12px}
.brand:hover{background:var(--hover-wash)}
.brand__mark{
  width:40px;height:40px;border-radius:12px;position:relative;overflow:hidden;
  background:linear-gradient(140deg, #7DFF7D 0%, var(--lime) 42%, #00C400 100%);
  display:grid;place-items:center;
  box-shadow:0 3px 14px rgba(0,220,60,.4), inset 0 1px 0 rgba(255,255,255,.55);
}
.brand__mark svg{width:22px;height:22px}
.brand__name{
  font-size:21px;font-weight:800;letter-spacing:-.7px;line-height:1;
  background:linear-gradient(120deg, #00D400, #00FF40 55%, #00C800);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.brand__name small{
  display:block;font-size:9.5px;font-weight:700;letter-spacing:.24em;
  color:var(--ink-3);-webkit-text-fill-color:var(--ink-3);
  margin-top:2px;
}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{
  position:relative;
  padding:10px 15px;border-radius:11px;
  font-size:14.5px;font-weight:700;color:var(--ink-2);
  transition:color .16s, background .16s;
}
.nav a:hover{color:var(--ink);background:var(--hover-wash)}
.nav a.on{color:var(--lime-deep)}
.nav a.on::after{
  content:'';position:absolute;left:15px;right:15px;bottom:4px;height:3px;
  border-radius:2px;background:linear-gradient(90deg,var(--lime),var(--lime-deep));
}
.find{flex:1;max-width:430px;margin-left:auto;position:relative}
.find__ico{position:absolute;left:15px;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.find input{
  width:100%;height:46px;
  padding:0 76px 0 43px;
  border:1.5px solid var(--line-2);border-radius:13px;
  background:var(--paper);
  font-size:14px;font-weight:500;
  transition:border-color .18s, box-shadow .18s;
}
.find input::placeholder{color:var(--ink-3);font-weight:500}
.find input:focus{outline:none;border-color:var(--lime-deep);box-shadow:0 0 0 4px rgba(0,220,60,.12)}
.find kbd{
  position:absolute;right:12px;top:50%;translate:0 -50%;
  font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink-3);
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;
  padding:3px 7px;background:var(--bg);
}
.acts{display:flex;align-items:center;gap:9px;flex-shrink:0}
.knob{
  position:relative;
  width:44px;height:44px;border-radius:13px;
  border:1.5px solid var(--line-2);background:var(--paper);
  display:grid;place-items:center;color:var(--ink-2);
  transition:all .18s var(--ease);
}
.knob svg{width:19px;height:19px}
.knob:hover{
  border-color:var(--lime-deep);color:var(--lime-deep);
  background:var(--hover-wash);transform:translateY(-1px);
}
.knob .pip{
  position:absolute;top:-5px;right:-5px;
  min-width:19px;height:19px;padding:0 5px;
  border-radius:10px;background:var(--lime-deep);color:#fff;
  border:2.5px solid var(--paper);
  font-size:10.5px;font-weight:800;display:grid;place-items:center;
}
.knob .pip:empty, .knob .pip[data-zero]{display:none}
.btn-go{
  height:44px;padding:0 22px;border-radius:13px;
  background:linear-gradient(140deg,#5CFF5C, var(--lime) 45%, #00D400);
  color:var(--lime-ink);
  font-size:14.5px;font-weight:800;
  box-shadow:0 4px 16px rgba(0,220,60,.38), inset 0 1px 0 rgba(255,255,255,.5);
  transition:all .18s var(--ease);
}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,220,60,.45)}
.btn-burger{display:none}

/* Переключатели */
.seg{
  display:flex;align-items:center;
  background:var(--paper);
  border:1.5px solid var(--line-2);border-radius:13px;
  padding:3px;gap:2px;
  height:44px;
}
.seg__btn{
  min-width:38px;height:36px;padding:0 8px;
  border-radius:10px;
  display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:var(--ink-3);
  transition:all .16s var(--ease);
}
.seg__btn svg{width:17px;height:17px}
.seg__btn:hover{color:var(--ink)}
.seg__btn.on{
  background:var(--hover-wash);
  color:var(--lime-deep);
  box-shadow:inset 0 0 0 1.5px var(--lime-line);
}
.seg--theme .seg__btn{min-width:44px;width:44px;padding:0}

/* Мобильное меню */
.veil{
  position:fixed;inset:0;z-index:190;
  background:rgba(12,16,12,.5);
  opacity:0;pointer-events:none;transition:opacity .26s;
}
.veil.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;top:0;right:0;z-index:200;
  width:min(100vw, 360px);height:100dvh;
  background:var(--paper);
  transform:translateX(105%);
  transition:transform .34s var(--ease);
  display:flex;flex-direction:column;
  box-shadow:-18px 0 60px rgba(0,0,0,.2);
  visibility:hidden;
}
.sheet.open{transform:translateX(0);visibility:visible}
.sheet__top{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;border-bottom:1px solid var(--line);
}
.sheet__ttl{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.sheet__x{
  width:40px;height:40px;border-radius:11px;
  border:1.5px solid var(--line-2);background:var(--paper-2);
  display:grid;place-items:center;color:var(--ink-2);
  transition:.16s;
}
.sheet__x:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);transform:rotate(90deg)}
.sheet__body{flex:1;overflow-y:auto;padding:16px}
.sheet__foot{padding:14px 18px;border-top:1px solid var(--line)}
.sheet__foot .btn-go{width:100%}
.sheet__prefs{display:flex;flex-direction:column;gap:12px;padding:4px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sheet__prefs .seg{width:100%;height:48px}
.sheet__prefs .seg__btn{flex:1}
.rail-clone{background:transparent;border:none;box-shadow:none;position:static;max-height:none;overflow:visible;padding:0}

/* ═══════════ КАРКАС ═══════════ */
.frame{max-width:1400px;margin:0 auto;padding:26px 26px 64px}

/* ═══════════ БАННЕР-КАРУСЕЛЬ (как в Steam) ═══════════ */
.hero{
  position:relative;
  border-radius:var(--r-l);
  overflow:hidden;
  box-shadow:var(--sh-1);
  aspect-ratio: 1000 / 354;
  max-height:440px;
  background:#000;
}
.hero__track{
  display:flex;height:100%;
  transition:transform .55s var(--ease);
}
.hero__slide{
  min-width:100%;height:100%;position:relative;
  display:flex;align-items:flex-end;
}
.hero__art{
  position:absolute;inset:0;
  display:grid;place-items:center;
}
.hero__art .capsule{
  width:100%;height:100%;object-fit:cover;object-position:center 22%;
  user-select:none;pointer-events:none;
}
.hero__art .fallback{
  font-size:130px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.4));
}
.hero__slide::after{ /* затемнение снизу для читаемости текста */
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.82) 100%);
}
.hero__cap{
  position:relative;z-index:2;
  padding:28px 34px;
  color:#fff;
  max-width:640px;
}
.hero__cap h2{
  font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.15;
  text-shadow:0 2px 14px rgba(0,0,0,.5);
}
.hero__cap p{
  margin-top:7px;font-size:14.5px;font-weight:600;
  color:rgba(255,255,255,.86);
  text-shadow:0 1px 8px rgba(0,0,0,.5);
}
.hero__meta{
  display:flex;align-items:center;gap:12px;margin-top:14px;
}
.hero__price{
  display:inline-flex;align-items:baseline;gap:8px;
  background:var(--lime);color:var(--lime-ink);
  padding:7px 14px;border-radius:10px;
  font-size:16px;font-weight:800;
  box-shadow:0 4px 16px rgba(0,220,60,.4);
}
.hero__old{
  color:rgba(255,255,255,.65);text-decoration:line-through;font-size:14px;
}
.hero__link{
  display:inline-flex;align-items:center;gap:7px;
  color:#fff;font-size:14px;font-weight:800;
  padding:8px 14px;border-radius:10px;
  background:rgba(255,255,255,.14);
  border:1.5px solid rgba(255,255,255,.3);
  backdrop-filter:blur(6px);
  transition:.16s;
}
.hero__link:hover{background:rgba(255,255,255,.24);transform:translateX(2px)}
.hero__nav{
  position:absolute;top:50%;translate:0 -50%;z-index:3;
  width:44px;height:60px;border-radius:12px;
  background:rgba(0,0,0,.44);color:#fff;
  display:grid;place-items:center;
  font-size:20px;
  backdrop-filter:blur(4px);
  transition:.18s;
  opacity:0;
}
.hero:hover .hero__nav{opacity:1}
.hero__nav:hover{background:rgba(0,0,0,.7)}
.hero__nav--l{left:14px}
.hero__nav--r{right:14px}
.hero__dots{
  position:absolute;bottom:14px;right:20px;z-index:3;
  display:flex;gap:7px;
}
.hero__dot{
  width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.4);
  transition:.2s;
  border:none;padding:0;
}
.hero__dot.on{
  background:var(--lime);
  width:26px;border-radius:99px;
  box-shadow:0 0 10px rgba(0,255,0,.6);
}
.hero__badge{
  position:absolute;top:16px;left:16px;z-index:3;
  padding:5px 12px;border-radius:9px;
  font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(0,0,0,.5);color:#fff;
  backdrop-filter:blur(4px);
}
.hero__badge.new{background:var(--lime);color:var(--lime-ink)}
.hero__badge.hot{background:var(--red)}

/* ═══════════ ПОЛКИ ═══════════ */
.shelf{margin-top:44px}
.shelf__head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;margin-bottom:16px;
}
.shelf__name{display:flex;align-items:center;gap:11px}
.shelf__name .emo{
  width:38px;height:38px;border-radius:12px;
  background:var(--paper);
  border:1px solid var(--line);
  display:grid;place-items:center;font-size:19px;
  box-shadow:var(--sh-1);
}
.shelf__name h2{font-size:21px;font-weight:800;letter-spacing:-.4px}
.shelf__name p{font-size:12px;font-weight:600;color:var(--ink-3);margin-top:1px}
.shelf__more{
  display:inline-flex;align-items:center;gap:7px;
  height:38px;padding:0 16px 0 18px;
  border-radius:11px;border:1.5px solid var(--line-2);
  background:var(--paper);
  font-size:13px;font-weight:800;color:var(--lime-deep);
  transition:all .18s var(--ease);
}
.shelf__more .arr{transition:transform .2s var(--ease)}
.shelf__more:hover{
  border-color:var(--lime-deep);background:var(--hover-wash);
  transform:translateX(2px);
}
.shelf__more:hover .arr{transform:translateX(3px)}

.row{
  display:grid;
  grid-template-columns:repeat(5, minmax(0,1fr));
  gap:15px;
}
.item{
  position:relative;
  background:var(--paper);
  border:1.5px solid transparent;
  border-radius:var(--r-m);
  box-shadow:var(--sh-1);
  overflow:hidden;
  cursor:pointer;
  transition:transform .24s var(--ease), box-shadow .24s, border-color .24s, background .3s;
}
.item::before{
  content:'';position:absolute;top:0;left:12%;right:12%;height:2.5px;
  border-radius:0 0 4px 4px;
  background:linear-gradient(90deg, transparent, var(--lime), transparent);
  opacity:0;transition:opacity .24s;
}
.item:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(0,170,50,.16);border-color:var(--lime-line)}
.item:hover::before{opacity:1}
.item__pic{
  position:relative;
  aspect-ratio:16/10;
  background:linear-gradient(135deg, var(--pic-a) 0%, var(--pic-b) 100%);
  display:grid;place-items:center;
  overflow:hidden;
}
.item__pic .capsule{
  width:38%;aspect-ratio:600/900;object-fit:cover;
  border-radius:0 8px 8px 0;
  box-shadow:4px 0 18px rgba(0,0,0,.35);
  transform:translateX(-8%);
}
.item__glyph{font-size:46px;position:relative;z-index:1;transition:transform .32s var(--ease)}
.item:hover .item__glyph{transform:scale(1.12) rotate(-3deg)}
.item__plat{
  position:absolute;left:10px;bottom:10px;z-index:2;
  font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:8px;
  background:rgba(255,255,255,.94);
  color:#545B54;
  box-shadow:0 1px 5px rgba(0,0,0,.09);
}
.tag{
  position:absolute;top:10px;left:10px;z-index:2;
  font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:4.5px 10px;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.tag--new{background:var(--lime);color:var(--lime-ink)}
.tag--hot{background:var(--red);color:#fff}
.tag--cut{background:var(--red);color:#fff}
.star{
  position:absolute;top:9px;right:9px;z-index:3;
  width:33px;height:33px;border-radius:50%;
  background:rgba(255,255,255,.95);
  box-shadow:0 2px 10px rgba(0,0,0,.14);
  display:grid;place-items:center;
  font-size:16.5px;line-height:1;color:#889488;
  transition:all .2s var(--ease);
}
.star:hover{transform:scale(1.14);background:#FFF7DC;color:#C89B00}
.star.on{background:var(--gold);color:#7A5A00}
.item__info{padding:13px 14px 14px}
.item__name{
  font-size:13.5px;font-weight:800;line-height:1.4;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:38px;margin-bottom:6px;
}
.item:hover .item__name{color:var(--lime-deep)}
.item__sub{
  font-size:11.5px;font-weight:700;color:var(--ink-3);
  margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.item__buy{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.price{display:flex;flex-direction:column;gap:2px}
.price__now{font-size:17px;color:var(--lime-deep)}
.price__was{font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:line-through}
.price__was b{color:var(--red);text-decoration:none;font-weight:800;margin-right:4px}
.tocart{
  width:36px;height:36px;flex-shrink:0;border-radius:11px;
  background:var(--hover-wash);color:var(--lime-deep);
  display:grid;place-items:center;
  transition:all .18s var(--ease);
}
.tocart svg{width:16px;height:16px}
.tocart:hover{background:var(--lime);color:var(--lime-ink);transform:scale(1.08)}

/* ═══════════ ФУТЕР ═══════════ */
.ftr{border-top:1px solid var(--line);background:var(--paper);margin-top:10px}
.ftr__in{
  max-width:1400px;margin:0 auto;padding:34px 26px;
  display:flex;align-items:center;justify-content:space-between;
  gap:22px;flex-wrap:wrap;
}
.ftr__brand{display:flex;align-items:center;gap:9px}
.ftr__brand .brand__mark{width:30px;height:30px;border-radius:9px}
.ftr__brand .brand__mark svg{width:16px;height:16px}
.ftr__brand b{font-size:15px;font-weight:800;color:var(--lime-deep)}
.ftr__note{font-size:12.5px;color:var(--ink-3);font-weight:600}
.ftr__nav{display:flex;gap:22px;flex-wrap:wrap}
.ftr__nav a{font-size:13px;font-weight:700;color:var(--ink-2);transition:.15s}
.ftr__nav a:hover{color:var(--lime-deep)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:28px;z-index:400;
  translate:-50% 16px;
  display:flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--bg);
  padding:13px 20px;border-radius:14px;
  font-size:13.5px;font-weight:700;
  box-shadow:var(--sh-2);
  opacity:0;pointer-events:none;
  transition:all .28s var(--ease);
}
.toast.show{opacity:1;translate:-50% 0}
.toast .s{color:var(--gold);font-size:15px}

/* ═══════════ АДАПТИВ ═══════════ */
@media (max-width:1250px){ .row{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:1040px){
  .row{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nav{display:none}
  .find kbd{display:none}
}
@media (max-width:840px){
  .find{display:none}
  .btn-go{display:none}
  .btn-burger{
    display:grid;place-items:center;
    width:44px;height:44px;border-radius:13px;
    border:1.5px solid var(--line-2);background:var(--paper);
    color:var(--ink-2);
  }
  .hero{aspect-ratio:auto;min-height:340px}
  .hero__cap h2{font-size:22px}
  .hero__cap p{font-size:13px}
  .hero__cap{padding:20px 22px}
  .hero__nav{opacity:1;width:38px;height:52px}
}
@media (max-width:620px){
  .row{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .item__name{font-size:12.5px;min-height:35px}
  .price__now{font-size:15.5px}
  .hdr__in{padding:11px 14px;gap:11px}
  .brand__name{font-size:18px}
  .brand__mark{width:35px;height:35px}
  .seg--theme, .seg--lang, .hdr .seg[role="group"][aria-label="Валюта"] { display:none }
  .hero{min-height:300px}
  .hero__cap h2{font-size:19px}
  .hero__cap p{display:none}
  .hero__dots{bottom:12px;right:14px}
}
</style>
</head>
<body>

<!-- ═══════════ ШАПКА ═══════════ -->
<header class="hdr">
  <div class="hdr__in">
    <a class="brand" href="index.html">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#053B05" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 11.5h4M8 9.5v4"/>
          <circle cx="15.2" cy="10.7" r=".9" fill="#053B05" stroke="none"/>
          <circle cx="17.8" cy="12.7" r=".9" fill="#053B05" stroke="none"/>
          <path d="M17.3 5.5H6.7a4 4 0 0 0-3.97 3.56c-.27 2.1-.45 4.3-.45 5.5 0 2.62 1.6 3.97 3.86 3.97 1.28 0 2.23-.56 3-1.32l.9-.9a2.6 2.6 0 0 1 3.9.02l.88.9c.78.76 1.72 1.3 3 1.3 2.26 0 3.86-1.35 3.86-3.97 0-1.2-.18-3.4-.45-5.5A4 4 0 0 0 17.3 5.5z"/>
        </svg>
      </span>
      <span class="brand__name">GameStore<small data-i18n="brandSub">ЭКСКЛЮЗИВНЫЕ АККАУНТЫ</small></span>
    </a>

    <nav class="nav" aria-label="Разделы">
      <a class="on" href="index.html" data-i18n="navHome">Главная</a>
      <a href="catalog.html" data-i18n="navCatalog">Каталог</a>
      <a href="#" data-i18n="navHelp">Помощь</a>
    </nav>

    <div class="find">
      <svg class="find__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20.2 20.2-3.7-3.7"/></svg>
      <input type="search" placeholder="Найти аккаунт, игру или ключ…" aria-label="Поиск" data-i18n-ph="searchPh">
      <kbd>Ctrl K</kbd>
    </div>

    <div class="acts">
      <div class="seg seg--theme" role="group" aria-label="Тема">
        <button class="seg__btn on" data-set-theme="light" aria-label="Светлая тема">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7"/></svg>
        </button>
        <button class="seg__btn" data-set-theme="dark" aria-label="Тёмная тема">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 14.2A8.6 8.6 0 0 1 9.8 3.4a8.6 8.6 0 1 0 10.8 10.8z"/></svg>
        </button>
      </div>

      <div class="seg seg--lang" role="group" aria-label="Язык">
        <button class="seg__btn on" data-set-lang="ru">RU</button>
        <button class="seg__btn" data-set-lang="en">EN</button>
      </div>

      <div class="seg" role="group" aria-label="Валюта">
        <button class="seg__btn on" data-set-cur="USD">$</button>
        <button class="seg__btn" data-set-cur="RUB">₽</button>
        <button class="seg__btn" data-set-cur="EUR">€</button>
      </div>

      <button class="knob" id="heartBtn" aria-label="Желаемое">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.5-1.5 2-3.1 2-4.6A4.4 4.4 0 0 0 16.6 5c-1.7 0-3 .9-4.6 2.6C10.4 5.9 9.1 5 7.4 5A4.4 4.4 0 0 0 3 9.4c0 1.5.5 3.1 2 4.6l7 7z"/></svg>
        <span class="pip" id="heartPip" data-zero></span>
      </button>
      <button class="knob" aria-label="Корзина">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9.3" cy="19.8" r="1.5"/><circle cx="17" cy="19.8" r="1.5"/><path d="M3.2 4h2.4l2.2 11.1a2 2 0 0 0 2 1.6h8a2 2 0 0 0 2-1.6L21.3 8H6.1"/></svg>
        <span class="pip" data-zero>0</span>
      </button>
      <button class="btn-go" data-i18n="login">Войти</button>
      <button class="btn-burger" id="burger" aria-label="Меню" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ═══════════ МОБИЛЬНАЯ ПАНЕЛЬ ═══════════ -->
<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet__top">
    <span class="sheet__ttl" data-i18n="menu">Меню</span>
    <button class="sheet__x" id="sheetX" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>
    </button>
  </div>
  <div class="sheet__body" id="sheetBody">
    <nav class="sheet__links" id="sheetLinks" style="display:flex;flex-direction:column;gap:2px;margin-bottom:14px"></nav>
    <div class="sheet__prefs">
      <div class="seg" role="group" aria-label="Язык">
        <button class="seg__btn on" data-set-lang="ru">RU — Русский</button>
        <button class="seg__btn" data-set-lang="en">EN — English</button>
      </div>
      <div class="seg" role="group" aria-label="Тема">
        <button class="seg__btn on" data-set-theme="light" data-i18n="themeLight">☀️ Светлая</button>
        <button class="seg__btn" data-set-theme="dark" data-i18n="themeDark">🌙 Тёмная</button>
      </div>
      <div class="seg" role="group" aria-label="Валюта">
        <button class="seg__btn on" data-set-cur="USD">USD $</button>
        <button class="seg__btn" data-set-cur="RUB">RUB ₽</button>
        <button class="seg__btn" data-set-cur="EUR">EUR €</button>
      </div>
      <span class="cur-note" style="font-size:11.5px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px">
        <span data-i18n="curNote">Все цены в USD. Другая валюта — для удобства просмотра.</span>
      </span>
    </div>
  </div>
</aside>

<!-- ═══════════ КОНТЕНТ ═══════════ -->
<div class="frame">

  <!-- Баннерная карусель -->
  <section class="hero" id="hero" aria-label="Рекомендуемое">
    <div class="hero__track" id="heroTrack"></div>
    <button class="hero__nav hero__nav--l" id="heroPrev" aria-label="Назад">‹</button>
    <button class="hero__nav hero__nav--r" id="heroNext" aria-label="Вперёд">›</button>
    <div class="hero__dots" id="heroDots"></div>
  </section>

  <!-- Полки наполняет JS из GAMES -->
  <div id="shelves"></div>

</div>

<!-- ═══════════ ФУТЕР ═══════════ -->
<footer class="ftr">
  <div class="ftr__in">
    <div>
      <div class="ftr__brand">
        <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none" stroke="#053B05" stroke-width="2.1" stroke-linecap="round"><path d="M6 11.5h4M8 9.5v4"/><path d="M17.3 5.5H6.7a4 4 0 0 0-3.97 3.56c-.27 2.1-.45 4.3-.45 5.5 0 2.62 1.6 3.97 3.86 3.97 1.28 0 2.23-.56 3-1.32l.9-.9a2.6 2.6 0 0 1 3.9.02l.88.9c.78.76 1.72 1.3 3 1.3 2.26 0 3.86-1.35 3.86-3.97 0-1.2-.18-3.4-.45-5.5A4 4 0 0 0 17.3 5.5z"/></svg></span>
        <b>GameStore</b>
      </div>
      <p class="ftr__note" style="margin-top:8px">© 2026 GameStore.<br><span data-i18n="curNote">Все цены в USD. Другая валюта — для удобства просмотра.</span></p>
    </div>
    <nav class="ftr__nav">
      <a href="#" data-i18n="ftAbout">О магазине</a>
      <a href="#" data-i18n="ftWarranty">Гарантии</a>
      <a href="#" data-i18n="ftPay">Оплата</a>
      <a href="#" data-i18n="ftSupport">Поддержка</a>
    </nav>
  </div>
</footer>

<div class="toast" id="toast" role="status"><span class="s">★</span><span id="toastMsg"></span></div>

<script src="gs_data.js"></script>
<script src="gs_shared.js"></script>
<script>
(() => {
  'use strict';
  const { $, $$, lang, L, fmt, wishBind, toast } = GS;

  /* ═══ БАННЕРНАЯ КАРУСЕЛЬ ═══ */
  const track = $('#heroTrack');
  const dots  = $('#heroDots');

  BANNERS.forEach((b, i) => {
    const g = GAMES.find(x => x.id === b.gameId);
    const slide = document.createElement('div');
    slide.className = 'hero__slide';
    const artKey = ART_BY_ID[g.id];
    const art = artKey
      ? `<img class="capsule" src="${steamCapsule(STEAM_ART[artKey])}" alt="" loading="${i===0?'eager':'lazy'}"
             onerror="this.style.display='none';this.parentElement.querySelector('.fallback').style.display='block'">
         <span class="fallback" style="display:none">${g.emoji}</span>`
      : `<span class="fallback">${g.emoji}</span>`;
    const style = `background:linear-gradient(135deg, ${g.gradient[0]}, ${g.gradient[1]})`;
    slide.innerHTML = `
      <div class="hero__art" style="${style}">${art}</div>
      ${g.badge ? `<span class="hero__badge ${g.badge}">${g.badge === 'new' ? 'NEW' : 'HOT'}</span>` : ''}
      <div class="hero__cap">
        <h2>${b.headline[lang()]}</h2>
        <p>${b.sub[lang()]}</p>
        <div class="hero__meta">
          <span class="hero__price money" data-usd="${g.price}">${fmt(g.price)}</span>
          ${g.oldPrice ? `<span class="hero__old money" data-usd="${g.oldPrice}">${fmt(g.oldPrice)}</span>` : ''}
          <a class="hero__link" href="product.html?id=${g.id}">
            ${L('viewMore')} <span>→</span>
          </a>
        </div>
      </div>`;
    track.appendChild(slide);

    const dot = document.createElement('button');
    dot.className = 'hero__dot' + (i === 0 ? ' on' : '');
    dot.setAttribute('aria-label', `Слайд ${i+1}`);
    dot.addEventListener('click', () => go(i));
    dots.appendChild(dot);
  });

  let idx = 0, timer;
  const N = BANNERS.length;
  function go(i){
    idx = (i + N) % N;
    track.style.transform = `translateX(-${idx * 100}%)`;
    $$('.hero__dot').forEach((d, k) => d.classList.toggle('on', k === idx));
    restart();
  }
  function restart(){
    clearInterval(timer);
    timer = setInterval(() => go(idx + 1), 5200);
  }
  $('#heroPrev').addEventListener('click', () => go(idx - 1));
  $('#heroNext').addEventListener('click', () => go(idx + 1));
  restart();

  /* пауза при ховере */
  const hero = $('#hero');
  hero.addEventListener('mouseenter', () => clearInterval(timer));
  hero.addEventListener('mouseleave', restart);

  /* свайп на мобиле */
  let touchX = null;
  hero.addEventListener('touchstart', e => touchX = e.touches[0].clientX, { passive: true });
  hero.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
    touchX = null;
  }, { passive: true });

  /* ═══ ПОЛКИ ═══ */
  function card(g){
    const artKey = ART_BY_ID[g.id];
    const art = artKey
      ? `<img class="capsule" src="${steamCapsule(STEAM_ART[artKey])}" alt="" loading="lazy"
             onerror="this.remove()">`
      : '';
    const badge = g.badge === 'new' ? '<span class="tag tag--new">New</span>'
                : g.badge === 'hot' ? '<span class="tag tag--hot">Hot</span>'
                : g.oldPrice ? `<span class="tag tag--cut">−${Math.round((1 - g.price / g.oldPrice) * 100)}%</span>`
                : '';
    return `
    <article class="item" onclick="location.href='product.html?id=${g.id}'">
      <div class="item__pic">${art}<span class="item__glyph">${g.emoji}</span>${badge}<button class="star" aria-label="В желаемое" onclick="event.stopPropagation()">☆</button><span class="item__plat">${g.platform}</span></div>
      <div class="item__info">
        <h3 class="item__name">${g.title[lang()]}</h3>
        <div class="item__sub">${g.short[lang()]}</div>
        <div class="item__buy">
          <div class="price">
            <span class="price__now money" data-usd="${g.price}">${fmt(g.price)}</span>
            ${g.oldPrice ? `<span class="price__was"><b>−${Math.round((1 - g.price / g.oldPrice) * 100)}%</b> <span class="money" data-usd="${g.oldPrice}">${fmt(g.oldPrice)}</span></span>` : ''}
          </div>
          <button class="tocart" aria-label="Добавить в корзину" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </article>`;
  }

  function shelf(key, titleKey, subKey, emo, items){
    if (!items.length) return '';
    return `
    <section class="shelf">
      <div class="shelf__head">
        <div class="shelf__name">
          <span class="emo">${emo}</span>
          <div><h2>${L(titleKey)}</h2><p>${L(subKey)}</p></div>
        </div>
        <a class="shelf__more" href="catalog.html?sort=${key}">${L('seeAll')} <span class="arr">→</span></a>
      </div>
      <div class="row">${items.map(card).join('')}</div>
    </section>`;
  }

  const byNew     = [...GAMES].sort((a,b) => b.added - a.added).slice(0, 5);
  const byPopular = [...GAMES].sort((a,b) => b.sold - a.sold).slice(0, 5);
  const byUpdated = [...GAMES].sort((a,b) => b.updated - a.updated).slice(0, 5);

  $('#shelves').innerHTML =
    shelf('new', 'shNew', 'shNewSub', '🆕', byNew) +
    shelf('popular', 'shHot', 'shHotSub', '🔥', byPopular) +
    shelf('updated', 'shUpdated', 'shUpdatedSub', '🔄', byUpdated);

  /* ═══ Мобильное меню: ссылки ═══ */
  const links = $('#sheetLinks');
  links.innerHTML = `
    <a class="nav__m on" href="index.html">${L('navHome')}</a>
    <a class="nav__m" href="catalog.html">${L('navCatalog')}</a>
    <a class="nav__m" href="#">${L('navHelp')}</a>
    <style>
      .nav__m{padding:13px 14px;border-radius:11px;font-size:15px;font-weight:800;color:var(--ink-2)}
      .nav__m:hover,.nav__m.on{background:var(--hover-wash);color:var(--lime-deep)}
    </style>`;
})();
</script>
</body>
</html>
