<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — GameStore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }

:root{
  --bg:#F0F0F0; --paper:#FFFFFF; --paper-2:#FAFBFA; --hover-wash:#F0F8F0;
  --lime:#00FF00; --lime-deep:#0ECC0E; --lime-ink:#053B05; --lime-line:#C4ECC4;
  --ink:#171B17; --ink-2:#545B54; --ink-3:#969E96;
  --line:#E4E7E4; --line-2:#D8DDD8; --red:#E5484D; --red-bg:#FDEDEE; --gold:#FFD84D;
  --hdr-bg:rgba(255,255,255,.86); --pic-a:#ECF7EC; --pic-b:#D8EFD8;
  --sh-1:0 1px 2px rgba(23,27,23,.05), 0 3px 12px rgba(23,27,23,.05);
  --sh-2:0 12px 32px rgba(23,27,23,.13);
  --r-s:10px; --r-m:14px; --r-l:18px;
  --ease:cubic-bezier(.22,.75,.28,1);
}
html[data-theme="dark"]{
  --bg:#101310; --paper:#191D19; --paper-2:#1E231E; --hover-wash:#1C2A1C;
  --lime:#3DFF3D; --lime-deep:#2FE22F; --lime-ink:#052B05; --lime-line:#2A4A2A;
  --ink:#E8ECE8; --ink-2:#A8B0A8; --ink-3:#6B756B;
  --line:#262B26; --line-2:#313831; --red:#FF6369; --red-bg:#3A1E20; --gold:#FFD84D;
  --hdr-bg:rgba(20,24,20,.86); --pic-a:#1B271B; --pic-b:#223022;
  --sh-1:0 1px 2px rgba(0,0,0,.3), 0 3px 12px rgba(0,0,0,.25);
  --sh-2:0 12px 32px rgba(0,0,0,.5);
}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:radial-gradient(1100px 500px at 85% -8%, rgba(0,255,0,.045), transparent 62%), var(--bg);
  color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  transition:background .3s, color .3s;
}
a{color:inherit;text-decoration:none}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
img,svg{display:block}
:focus-visible{outline:2.5px solid var(--lime-deep);outline-offset:2px;border-radius:6px}
.money{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.4px}

/* Шапка (общая) */
.hdr{position:sticky;top:0;z-index:130;background:var(--hdr-bg);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);transition:background .3s}
.hdr::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent 0%,var(--lime) 18%,var(--lime) 82%,transparent 100%);opacity:.5}
.hdr__in{max-width:1400px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;border-radius:12px}
.brand__mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,#7DFF7D 0%,var(--lime) 42%,#00C400 100%);display:grid;place-items:center;box-shadow:0 3px 14px rgba(0,220,60,.4)}
.brand__mark svg{width:22px;height:22px}
.brand__name{font-size:21px;font-weight:800;letter-spacing:-.7px;line-height:1;background:linear-gradient(120deg,#00D400,#00FF40 55%,#00C800);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand__name small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.24em;color:var(--ink-3);-webkit-text-fill-color:var(--ink-3);margin-top:2px}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{padding:10px 15px;border-radius:11px;font-size:14.5px;font-weight:700;color:var(--ink-2);transition:.16s}
.nav a:hover{color:var(--ink);background:var(--hover-wash)}
.nav a.on{color:var(--lime-deep)}
.nav a.on::after{content:'';position:relative;display:block;height:3px;margin-top:2px;border-radius:2px;background:linear-gradient(90deg,var(--lime),var(--lime-deep))}
.find{flex:1;max-width:430px;margin-left:auto;position:relative}
.find__ico{position:absolute;left:15px;top:50%;translate:0 -50%;width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.find input{width:100%;height:46px;padding:0 76px 0 43px;border:1.5px solid var(--line-2);border-radius:13px;background:var(--paper);font-size:14px;font-weight:500}
.find input::placeholder{color:var(--ink-3)}
.find input:focus{outline:none;border-color:var(--lime-deep);box-shadow:0 0 0 4px rgba(0,220,60,.12)}
.find kbd{position:absolute;right:12px;top:50%;translate:0 -50%;font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:3px 7px;background:var(--bg)}
.acts{display:flex;align-items:center;gap:9px;flex-shrink:0}
.knob{position:relative;width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--paper);display:grid;place-items:center;color:var(--ink-2);transition:.18s}
.knob svg{width:19px;height:19px}
.knob:hover{border-color:var(--lime-deep);color:var(--lime-deep);background:var(--hover-wash)}
.knob .pip{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--lime-deep);color:#fff;border:2.5px solid var(--paper);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.knob .pip:empty,.knob .pip[data-zero]{display:none}
.btn-go{height:44px;padding:0 22px;border-radius:13px;background:linear-gradient(140deg,#5CFF5C,var(--lime) 45%,#00D400);color:var(--lime-ink);font-size:14.5px;font-weight:800;box-shadow:0 4px 16px rgba(0,220,60,.38)}
.btn-burger{display:none}
.seg{display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--line-2);border-radius:13px;padding:3px;gap:2px;height:44px}
.seg__btn{min-width:38px;height:36px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--ink-3);transition:.16s}
.seg__btn svg{width:17px;height:17px}
.seg__btn:hover{color:var(--ink)}
.seg__btn.on{background:var(--hover-wash);color:var(--lime-deep);box-shadow:inset 0 0 0 1.5px var(--lime-line)}
.seg--theme .seg__btn{min-width:44px;width:44px;padding:0}

.veil{position:fixed;inset:0;z-index:190;background:rgba(12,16,12,.5);opacity:0;pointer-events:none;transition:opacity .26s}
.veil.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;z-index:200;width:min(100vw,360px);height:100dvh;background:var(--paper);transform:translateX(105%);transition:transform .34s var(--ease);display:flex;flex-direction:column;box-shadow:-18px 0 60px rgba(0,0,0,.2);visibility:hidden}
.sheet.open{transform:translateX(0);visibility:visible}
.sheet__top{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.sheet__ttl{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.sheet__x{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line-2);background:var(--paper-2);display:grid;place-items:center;color:var(--ink-2)}
.sheet__x:hover{border-color:var(--red);color:var(--red)}
.sheet__body{flex:1;overflow-y:auto;padding:16px}
.sheet__foot{padding:14px 18px;border-top:1px solid var(--line)}
.sheet__foot .btn-go{width:100%}
.sheet__prefs{display:flex;flex-direction:column;gap:12px;padding:4px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sheet__prefs .seg{width:100%;height:48px}
.sheet__prefs .seg__btn{flex:1}
.rail-clone{background:transparent;border:none;box-shadow:none;position:static;max-height:none;overflow:visible;padding:0}

/* ── КАРКАС КАТАЛОГА ── */
.frame{
  max-width:1400px;margin:0 auto;
  display:grid;grid-template-columns:266px minmax(0,1fr);
  gap:26px;padding:26px 26px 64px;
  align-items:start;
}
.rail{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-1);position:sticky;top:92px;
  padding:20px 16px 14px;max-height:calc(100dvh - 112px);overflow-y:auto;
}
.rail__ttl{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);padding:0 4px 14px}
.rail__clear{font-size:11px;font-weight:800;color:var(--ink-3);padding:4px 9px;border-radius:8px;transition:.15s}
.rail__clear:hover{color:var(--red);background:var(--red-bg)}
.fam{border-top:1px solid var(--line)}
.fam__btn{width:100%;display:flex;align-items:center;gap:9px;padding:13px 6px;font-size:14px;font-weight:800;color:var(--ink);transition:.15s}
.fam__btn:hover{color:var(--lime-deep)}
.fam__btn .dot{min-width:21px;height:21px;border-radius:7px;background:var(--lime);color:var(--lime-ink);font-size:10.5px;font-weight:800;display:grid;place-items:center}
.fam__btn .chev{margin-left:auto;width:24px;height:24px;display:grid;place-items:center;color:var(--ink-3);font-size:10px;transition:transform .28s var(--ease)}
.fam.open .fam__btn .chev{transform:rotate(-180deg)}
.fam__pan{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.fam.open .fam__pan{grid-template-rows:1fr}
.fam__pan>div{overflow:hidden}
.fam__list{padding:2px 4px 14px;display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;gap:10px;padding:8.5px 10px;border-radius:10px;cursor:pointer;user-select:none;transition:.15s}
.chip:hover{background:var(--hover-wash)}
.chip__box{width:19px;height:19px;flex-shrink:0;border:1.8px solid var(--line-2);border-radius:6px;background:#fff;display:grid;place-items:center;transition:.18s}
html[data-theme="dark"] .chip__box{background:var(--paper-2)}
.chip__box svg{width:11px;height:11px;stroke:var(--lime-ink);stroke-width:3.6;opacity:0;transform:scale(.4);transition:.18s}
.chip.on .chip__box{background:var(--lime);border-color:var(--lime-deep)}
.chip.on .chip__box svg{opacity:1;transform:scale(1)}
.chip__lbl{flex:1;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip.on .chip__lbl{color:var(--lime-deep);font-weight:800}
.chip__n{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--bg);border-radius:99px;padding:2.5px 8px;font-variant-numeric:tabular-nums}
.chip.on .chip__n{background:rgba(0,210,60,.14);color:var(--lime-deep)}
.prange{display:flex;align-items:center;gap:7px;padding:6px 4px 10px}
.pfield{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.pfield input{width:100%;padding-right:26px}
.psym{
  position:absolute;right:11px;pointer-events:none;
  font-size:12.5px;font-weight:700;color:var(--ink-3);opacity:.55;
  font-family:'JetBrains Mono';
}
.fam.has-sel .fam__btn{color:var(--lime-deep)}
.fam.has-sel .fam__btn > span:first-child::after{
  content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--lime);margin-left:8px;vertical-align:middle;
  box-shadow:0 0 8px rgba(0,255,0,.7);
}
.prange input{flex:1;min-width:0;height:40px;padding:0 12px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--bg);font-size:13px;font-weight:600}
.prange input:focus{outline:none;border-color:var(--lime-deep);background:#fff}
html[data-theme="dark"] .prange input:focus{background:var(--paper-2)}
.prange span{color:var(--ink-3);font-weight:700}

/* ── Тулбар ── */
.deck{min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.bar__count{font-size:13.5px;font-weight:700;color:var(--ink-3)}
.bar__count b{color:var(--ink);font-weight:800}
.sort{position:relative}
.sort__btn{display:flex;align-items:center;gap:9px;height:46px;padding:0 18px;background:var(--paper);border:1.5px solid var(--line-2);border-radius:13px;font-size:14px;font-weight:700;box-shadow:var(--sh-1);transition:.18s}
.sort__btn em{font-style:normal;color:var(--ink-3);font-weight:600}
.sort__btn:hover{border-color:var(--lime-deep)}
.sort.open .sort__btn{border-color:var(--lime-deep)}
.sort__btn .car{font-size:10px;color:var(--ink-3);transition:transform .25s}
.sort.open .sort__btn .car{transform:rotate(-180deg);color:var(--lime-deep)}
.sort__pop{position:absolute;top:calc(100% + 9px);right:0;z-index:70;min-width:246px;padding:7px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-2);opacity:0;pointer-events:none;transform:translateY(-7px);transition:.2s}
.sort.open .sort__pop{opacity:1;pointer-events:auto;transform:none}
.sort__it{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:10.5px 13px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:.13s}
.sort__it:hover{background:var(--hover-wash);color:var(--ink)}
.sort__it.on{background:linear-gradient(90deg,rgba(0,255,0,.17),rgba(0,255,0,.07));color:var(--lime-deep);font-weight:800}
.sort__it .tick{font-size:12px;color:var(--lime-deep);opacity:0}
.sort__it.on .tick{opacity:1}

/* ── СЕТКА ── */
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.item{
  position:relative;background:var(--paper);border:1.5px solid transparent;border-radius:var(--r-m);
  box-shadow:var(--sh-1);overflow:hidden;cursor:pointer;
  transition:transform .24s var(--ease),box-shadow .24s,border-color .24s,background .3s;
}
.item::before{content:'';position:absolute;top:0;left:12%;right:12%;height:2.5px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,transparent,var(--lime),transparent);opacity:0;transition:opacity .24s}
.item:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(0,170,50,.16);border-color:var(--lime-line)}
.item:hover::before{opacity:1}
.item__pic{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--pic-a) 0%,var(--pic-b) 100%);display:grid;place-items:center;overflow:hidden}
.item__pic .capsule{width:38%;aspect-ratio:600/900;object-fit:cover;border-radius:0 8px 8px 0;box-shadow:4px 0 18px rgba(0,0,0,.35);transform:translateX(-8%)}
.item__glyph{font-size:46px;position:relative;z-index:1;transition:transform .32s}
.item:hover .item__glyph{transform:scale(1.12) rotate(-3deg)}
.item__plat{position:absolute;left:10px;bottom:10px;z-index:2;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.94);color:#545B54}
.tag{position:absolute;top:10px;left:10px;z-index:2;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:4.5px 10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tag--new{background:var(--lime);color:var(--lime-ink)}
.tag--hot{background:var(--red);color:#fff}
.tag--cut{background:var(--red);color:#fff}
.star{position:absolute;top:9px;right:9px;z-index:3;width:33px;height:33px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 2px 10px rgba(0,0,0,.14);display:grid;place-items:center;font-size:16.5px;color:#889488;transition:.2s}
.star:hover{transform:scale(1.14);background:#FFF7DC;color:#C89B00}
.star.on{background:var(--gold);color:#7A5A00}
.item__info{padding:13px 14px 14px}
.item__name{font-size:13.5px;font-weight:800;line-height:1.4;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px;margin-bottom:6px}
.item:hover .item__name{color:var(--lime-deep)}
.item__sub{font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item__buy{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.price{display:flex;flex-direction:column;gap:2px}
.price__now{font-size:17px;color:var(--lime-deep)}
.price__was{font-size:11px;font-weight:600;color:var(--ink-3);text-decoration:line-through}
.price__was b{color:var(--red);text-decoration:none;font-weight:800;margin-right:4px}
.tocart{width:36px;height:36px;flex-shrink:0;border-radius:11px;background:var(--hover-wash);color:var(--lime-deep);display:grid;place-items:center;transition:.18s}
.tocart svg{width:16px;height:16px}
.tocart:hover{background:var(--lime);color:var(--lime-ink);transform:scale(1.08)}

.empty{
  text-align:center;padding:80px 20px;color:var(--ink-3);
}
.empty h3{font-size:19px;font-weight:800;color:var(--ink-2);margin-bottom:8px}
.empty p{font-size:14px;font-weight:600}

/* Живой поиск: подсказки */
.sugg{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:120;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--sh-2);overflow:hidden;
}
.sugg__it{
  display:flex;align-items:center;gap:11px;
  padding:10px 14px;cursor:pointer;
  transition:background .12s;
}
.sugg__it:hover,.sugg__it.hl{background:var(--hover-wash)}
.sugg__ico{font-size:22px;flex-shrink:0}
.sugg__txt{flex:1;min-width:0}
.sugg__name{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg__sub{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.sugg__price{font-size:13.5px;font-weight:800;color:var(--lime-deep);flex-shrink:0}
.sugg__empty{padding:14px;font-size:13px;font-weight:600;color:var(--ink-3);text-align:center}

/* Выбор количества на странице */
.per-page{
  display:flex;align-items:center;justify-content:center;gap:12px;
  margin-top:16px;
  font-size:12.5px;font-weight:700;color:var(--ink-3);
}
.pp-seg{display:flex;gap:4px;background:var(--paper);border:1.5px solid var(--line-2);border-radius:11px;padding:3px}
.pp__btn{
  min-width:38px;height:32px;border-radius:8px;
  font-size:12.5px;font-weight:800;color:var(--ink-3);
  transition:.14s;
}
.pp__btn:hover{color:var(--ink)}
.pp__btn.on{background:var(--hover-wash);color:var(--lime-deep);box-shadow:inset 0 0 0 1.5px var(--lime-line)}

/* Пагинация */
.pages{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:48px}
.pg{min-width:43px;height:43px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--paper);font-size:13.5px;font-weight:800;color:var(--ink-2);transition:.16s}
.pg:hover{border-color:var(--lime-deep);color:var(--lime-deep);background:var(--hover-wash)}
.pg.on{background:linear-gradient(140deg,#5CFF5C,var(--lime) 50%,#00D400);border-color:var(--lime-deep);color:var(--lime-ink)}

/* Футер */
.ftr{border-top:1px solid var(--line);background:var(--paper);margin-top:10px}
.ftr__in{max-width:1400px;margin:0 auto;padding:34px 26px;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.ftr__brand{display:flex;align-items:center;gap:9px}
.ftr__brand .brand__mark{width:30px;height:30px;border-radius:9px}
.ftr__brand .brand__mark svg{width:16px;height:16px}
.ftr__brand b{font-size:15px;font-weight:800;color:var(--lime-deep)}
.ftr__note{font-size:12.5px;color:var(--ink-3);font-weight:600}
.ftr__nav{display:flex;gap:22px;flex-wrap:wrap}
.ftr__nav a{font-size:13px;font-weight:700;color:var(--ink-2);transition:.15s}
.ftr__nav a:hover{color:var(--lime-deep)}
.toast{position:fixed;left:50%;bottom:28px;z-index:400;translate:-50% 16px;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:14px;font-size:13.5px;font-weight:700;box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:.28s}
.toast.show{opacity:1;translate:-50% 0}
.toast .s{color:var(--gold);font-size:15px}

/* Адаптив */
@media (max-width:1250px){ .row{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:1040px){
  .nav{display:none}
  .frame{grid-template-columns:242px minmax(0,1fr);gap:20px;padding:22px 18px 56px}
  .find kbd{display:none}
}
@media (max-width:840px){
  .frame{grid-template-columns:minmax(0,1fr);padding:18px 14px 52px}
  .rail{display:none}
  .find{display:none}
  .btn-go{display:none}
  .btn-burger{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line-2);background:var(--paper);color:var(--ink-2)}
}
@media (max-width:620px){
  .row{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .item__name{font-size:12.5px;min-height:35px}
  .price__now{font-size:15.5px}
  .hdr__in{padding:11px 14px;gap:11px}
  .brand__name{font-size:18px}
  .brand__mark{width:35px;height:35px}
  .seg--theme,.seg--lang,.hdr .seg[role="group"][aria-label="Валюта"]{display:none}
  .bar{flex-wrap:wrap}
  .bar__count{width:100%}
  .sort{width:100%}
  .sort__btn{width:100%;justify-content:space-between}
  .sort__btn em{display:none}
  .sort__pop{left:0;right:auto;min-width:100%}
}


/* Ховер-галерея на карточке: эмодзи-скрины листаются при наведении */
.hg{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column}
.hg__row{position:absolute;inset:auto 0 0 0;display:flex;gap:4px;padding:8px 10px;opacity:0;transition:opacity .22s}
.item:hover .hg__row{opacity:1}
.hg__fr{
  flex:1;aspect-ratio:1/1;border-radius:8px;
  background:rgba(255,255,255,.9);
  display:grid;place-items:center;font-size:15px;
  box-shadow:0 1px 6px rgba(0,0,0,.12);
}
html[data-theme="dark"] .hg__fr{background:rgba(30,35,30,.9)}
.item:hover .item__glyph{opacity:0}
/* ── Масштабо-устойчивость (v2.2) ── */
body{ overflow-x:hidden }
.hdr__in{ padding-inline:clamp(14px, 3vw, 26px); flex-wrap:nowrap; min-width:0 }
.frame{ padding-inline:clamp(14px, 3vw, 26px) }

/* Сетка: auto-fill — карточки заполняют любую ширину без боковых пустот */

  grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)) !important;
}
@media (max-width:620px){
  .row, .sim-row{ grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)) !important }
}

<script>
(() => {
  'use strict';
  const { $, $$, lang, L, fmt, toast, state } = GS;

  /* ── Состояние фильтров ── */
  const F = {
    platform: new Set(),
    genre:    new Set(),
    type:     new Set(),
    region:   new Set(),
    priceFrom: null,
    priceTo:   null,
    sort: 'popular',
    page: 1,
    PER_PAGE: 12,
    sale: false,
  };

  /* URL-параметры (?sort=new) */
  const urlP = new URLSearchParams(location.search);
  if (urlP.get('sort') && ['popular','cheap','expensive','rating','new','updated','disc_big','disc_small'].includes(urlP.get('sort'))){
    F.sort = urlP.get('sort');
  }
  if (urlP.get('q')) $('#search').value = urlP.get('q');

  /* ── Построение фильтров из данных ── */
  function countFor(list, field, key){
    return GAMES.filter(g => list.includes(g[field])).length;
  }
  function chipGroup(containerId, field, dict){
    const box = $(containerId);
    box.innerHTML = Object.entries(dict).map(([k, v]) => {
      const n = GAMES.filter(g => Array.isArray(g[field]) ? g[field].includes(k) : g[field] === k).length;
      if (!n) return '';
      return `<label class="chip" data-k="${k}">
        <span class="chip__box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-10.5"/></svg></span>
        <span class="chip__lbl">${v[lang()]}</span><span class="chip__n">${n}</span>
      </label>`;
    }).join('');
    box.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
      c.classList.toggle('on');
      const k = c.dataset.k;
      F[field].has(k) ? F[field].delete(k) : F[field].add(k);
      F.page = 1;
      render();
    }));
  }

  chipGroup('#fPlatform', 'platform', Object.fromEntries(PLATFORMS.map(p => [p, { ru: p, en: p }])));
  chipGroup('#fGenre', 'genres', GENRES);
  chipGroup('#fType', 'type', TYPES);
  chipGroup('#fRegion', 'region', REGIONS);
  $('#nSale').textContent = GAMES.filter(g => g.oldPrice).length;

  $('#chipSale').addEventListener('click', () => {
    const c = $('#chipSale');
    c.classList.toggle('on');
    F.sale = c.classList.contains('on');
    F.page = 1; render();
    const dot = $('#rail .fam:has(#chipSale) .fam__btn .dot');
    const fam = $('#chipSale').closest('.fam');
    fam.classList.toggle('has-sel', F.sale);
    const existing = fam.querySelector('.fam__btn .dot');
    if (F.sale && !existing){
      const d = document.createElement('span');
      d.className = 'dot'; d.textContent = '☆';
      fam.querySelector('.fam__btn').prepend(d);
    } else if (!F.sale && existing){ existing.remove(); }
  });

  /* Аккордеоны сайдбара (клон получает свои через bindClone) */
  $$('#rail .fam__btn').forEach(b => b.addEventListener('click', () => {
    b.closest('.fam').classList.toggle('open');
  }));

  const RATES = { USD: 1, RUB: 92.5, EUR: 0.92 };
  function toUSD(v){ return state.cur === 'USD' ? v : v / RATES[state.cur]; }
  $('#pFrom').addEventListener('input', () => {
    const v = parseFloat($('#pFrom').value);
    F.priceFrom = v !== null && !isNaN(v) ? toUSD(v) : null;
    F.page = 1; render();
  });
  $('#pTo').addEventListener('input', () => {
    const v = parseFloat($('#pTo').value);
    F.priceTo = v !== null && !isNaN(v) ? toUSD(v) : null;
    F.page = 1; render();
  });
  // знак валюты в полях и обновление при смене валюты
  function syncPriceSym(){
    const sym = state.cur === 'USD' ? '$' : state.cur === 'RUB' ? '₽' : '€';
    $('#symFrom').textContent = sym;
    $('#symTo').textContent = sym;
  }
  document.addEventListener('gs-cur-changed', () => { syncPriceSym(); });

  /* Синхронизация фильтров: сайдбар ↔ клон в мобильном меню */
  function syncClone(){
    const clone = $('#sheetBody .rail-clone');
    if (!clone) return;
    const fresh = $('#rail').cloneNode(true);
    fresh.removeAttribute('id');
    fresh.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
    fresh.classList.remove('rail');
    fresh.classList.add('rail-clone');
    fresh.style.cssText = '';
    clone.replaceWith(fresh);
    bindClone(fresh);
  }
  function bindClone(root){
    root.querySelectorAll('.fam__btn').forEach(b => b.addEventListener('click', () => b.closest('.fam').classList.toggle('open')));
    root.querySelectorAll('.chip').forEach(c => c.addEventListener('click', e => {
      e.preventDefault();
      // клик по клону = клик по оригиналу (синхронизация)
      const field = { 'fPlatform':'platform','fGenre':'genres','fType':'type','fRegion':'region' };
      // находим оригинальный chip по позиции
      const famIdx = [...root.querySelectorAll('.fam')].indexOf(c.closest('.fam'));
      const chipIdx = [...c.closest('.fam__list').querySelectorAll('.chip')].indexOf(c);
      const origFam = $$('#rail .fam')[famIdx];
      const origChip = origFam && [...origFam.querySelectorAll('.chip')][chipIdx];
      if (origChip) origChip.click();
    }));
    root.querySelector('.rail__clear')?.addEventListener('click', () => $('#railClear').click());
    const pf = root.querySelector('input[aria-label="Цена от"]');
    const pt = root.querySelector('input[aria-label="Цена до"]');
    pf?.addEventListener('input', e => { $('#pFrom').value = e.target.value; $('#pFrom').dispatchEvent(new Event('input')); });
    pt?.addEventListener('input', e => { $('#pTo').value = e.target.value; $('#pTo').dispatchEvent(new Event('input')); });
  }

  /* ── Сортировка ── */
  const sortBox = $('#sort');
  const sortBtn = sortBox.querySelector('.sort__btn');
  const sortNow = $('#sortNow');
  sortBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = sortBox.classList.toggle('open');
    sortBtn.setAttribute('aria-expanded', open);
  });
  document.addEventListener('click', e => {
    if (!sortBox.contains(e.target)) { sortBox.classList.remove('open'); sortBtn.setAttribute('aria-expanded','false'); }
  });
  sortBox.querySelectorAll('.sort__it').forEach(it => it.addEventListener('click', () => {
    sortBox.querySelectorAll('.sort__it').forEach(o => o.classList.remove('on'));
    it.classList.add('on');
    sortNow.textContent = it.querySelector('span:not(.tick)').textContent;
    F.sort = it.dataset.k;
    F.page = 1;
    sortBox.classList.remove('open');
    render();
  }));
  // восстановить сортировку из URL
  const sortInit = sortBox.querySelector(`.sort__it[data-k="${F.sort}"]`);
  if (sortInit){
    sortBox.querySelectorAll('.sort__it').forEach(o => o.classList.remove('on'));
    sortInit.classList.add('on');
    sortNow.textContent = sortInit.querySelector('span:not(.tick)').textContent;
  }

  /* ── Поиск ── */
  let searchT;
  const sugg = $('#sugg');
  let hlIdx = -1;

  function showSugg(){
    const q = ($('#search').value || '').toLowerCase().trim();
    if (q.length < 1){ sugg.hidden = true; return; }
    const hits = GAMES.filter(g =>
      g.title.ru.toLowerCase().includes(q) || g.title.en.toLowerCase().includes(q) ||
      g.short.ru.toLowerCase().includes(q) || g.platform.toLowerCase().includes(q)
    ).slice(0, 6);
    if (!hits.length){
      sugg.innerHTML = `<div class="sugg__empty">${L('nothingFound') || 'Ничего не найдено'}</div>`;
      sugg.hidden = false;
      return;
    }
    sugg.innerHTML = hits.map(g => `
      <div class="sugg__it" data-id="${g.id}">
        <span class="sugg__ico">${g.emoji}</span>
        <span class="sugg__txt">
          <span class="sugg__name">${g.title[lang()]}</span>
          <span class="sugg__sub">${g.platform} · ${g.short[lang()]}</span>
        </span>
        <span class="sugg__price money" data-usd="${g.price}">${fmt(g.price)}</span>
      </div>`).join('');
    sugg.hidden = false;
    hlIdx = -1;
    $$('.sugg__it', sugg).forEach(it => it.addEventListener('mousedown', e => {
      e.preventDefault();
      location.href = `product.html?id=${it.dataset.id}`;
    }));
    $$('[data-usd]', sugg).forEach(el => { el.textContent = fmt(parseFloat(el.dataset.usd)); });
  }

  $('#search').addEventListener('input', () => {
    clearTimeout(searchT);
    showSugg();
    searchT = setTimeout(() => { F.page = 1; render(); }, 250);
  });
  $('#search').addEventListener('focus', showSugg);
  document.addEventListener('click', e => {
    if (!e.target.closest('.find')) sugg.hidden = true;
  });
  $('#search').addEventListener('keydown', e => {
    const items = $$('.sugg__it', sugg);
    if (e.key === 'ArrowDown' && items.length){ e.preventDefault(); hlIdx = (hlIdx + 1) % items.length; }
    else if (e.key === 'ArrowUp' && items.length){ e.preventDefault(); hlIdx = (hlIdx - 1 + items.length) % items.length; }
    else if (e.key === 'Enter' && hlIdx >= 0 && items[hlIdx]){ e.preventDefault(); items[hlIdx].click(); return; }
    else if (e.key === 'Escape'){ sugg.hidden = true; return; }
    else return;
    items.forEach((it, i) => it.classList.toggle('hl', i === hlIdx));
  });

  /* ── Фильтрация + сортировка ── */
  function getFiltered(){
    const q = ($('#search').value || '').toLowerCase().trim();
    let list = GAMES.filter(g => {
      if (F.platform.size && !F.platform.has(g.platform)) return false;
      if (F.genre.size && !g.genres.some(x => F.genre.has(x))) return false;
      if (F.type.size && !g.type.some(x => F.type.has(x))) return false;
      if (F.region.size && !F.region.has(g.region)) return false;
      if (F.priceFrom !== null && g.price < F.priceFrom) return false;
      if (F.priceTo !== null && g.price > F.priceTo) return false;
      if (F.sale && !g.oldPrice) return false;
      if (q && !(g.title.ru.toLowerCase().includes(q) || g.title.en.toLowerCase().includes(q) || g.short.ru.toLowerCase().includes(q) || g.platform.toLowerCase().includes(q))) return false;
      return true;
    });
    const disc = g => g.oldPrice ? (1 - g.price / g.oldPrice) : 0;
    const sorters = {
      popular:  (a,b) => b.sold - a.sold,
      cheap:    (a,b) => a.price - b.price,
      expensive:(a,b) => b.price - a.price,
      rating:   (a,b) => b.rating - a.rating,
      new:      (a,b) => b.added - a.added,
      updated:  (a,b) => b.updated - a.updated,
      disc_big:   (a,b) => disc(b) - disc(a),
      disc_small: (a,b) => disc(a) - disc(b),
    };
    list.sort(sorters[F.sort]);
    return list;
  }

  /* ── Рендер ── */
  function card(g){
    const artKey = ART_BY_ID[g.id];
    const art = artKey
      ? `<img class="capsule" src="${steamCapsule(STEAM_ART[artKey])}" alt="" loading="lazy" onerror="this.remove()">`
      : '';
    const badge = g.badge === 'new' ? '<span class="tag tag--new">New</span>'
                : g.badge === 'hot' ? '<span class="tag tag--hot">Hot</span>'
                : g.oldPrice ? `<span class="tag tag--cut">−${Math.round((1 - g.price / g.oldPrice) * 100)}%</span>`
                : '';
    return `
    <article class="item" data-game-id="${g.id}" onclick="location.href='product.html?id=${g.id}'">
      <div class="item__pic">${art}<span class="item__glyph">${g.emoji}</span>${badge}<button class="star" aria-label="В желаемое" onclick="event.stopPropagation()">☆</button><span class="item__plat">${g.platform}</span>
        <div class="hg"><div class="hg__row">${(g.media||[]).slice(0,4).map(m => `<span class="hg__fr">${m.emoji}</span>`).join('')}</div></div>
      </div>
      <div class="item__info">
        <h3 class="item__name">${g.title[lang()]}</h3>
        <div class="item__sub">${g.short[lang()]}</div>
        <div class="item__buy">
          <div class="price">
            <span class="price__now money" data-usd="${g.price}">${fmt(g.price)}</span>
            ${g.oldPrice ? `<span class="price__was"><b>−${Math.round((1 - g.price / g.oldPrice) * 100)}%</b> <span class="money" data-usd="${g.oldPrice}">${fmt(g.oldPrice)}</span></span>` : ''}
          </div>
          <button class="tocart" aria-label="Добавить в корзину" data-cart-add="${g.id}" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
    </article>`;
  }

  function render(){
    const list = getFiltered();
    const total = list.length;
    $('#cnt').textContent = total;

    // пагинация
    const pages = Math.max(1, Math.ceil(total / F.PER_PAGE));
    if (F.page > pages) F.page = pages;
    const slice = list.slice((F.page - 1) * F.PER_PAGE, F.page * F.PER_PAGE);

    $('#grid').innerHTML = slice.map(card).join('');
    $('#empty').style.display = total ? 'none' : 'block';
    $('#grid').style.display = total ? 'grid' : 'none';

    const pagesBox = $('#pages');
    $('#perPageBox').style.display = total > 12 ? 'flex' : 'none';
    $$('.pp__btn').forEach(b => b.classList.toggle('on', +b.dataset.pp === F.PER_PAGE));
    if (pages <= 1){ pagesBox.innerHTML = ''; }
    else {
      let html = `<button class="pg" data-p="${F.page-1}" ${F.page===1?'disabled style="opacity:.4"':''}>←</button>`;
      for (let i = 1; i <= pages; i++){
        html += `<button class="pg ${i===F.page?'on':''}" data-p="${i}">${i}</button>`;
      }
      html += `<button class="pg" data-p="${F.page+1}" ${F.page===pages?'disabled style="opacity:.4"':''}>→</button>`;
      pagesBox.innerHTML = html;
      pagesBox.querySelectorAll('.pg:not([disabled])').forEach(b => b.addEventListener('click', () => {
        F.page = parseInt(b.dataset.p);
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }));
    }

    $$('.pp__btn').forEach(b => {
      if (b._ppBound) return;
      b._ppBound = true;
      b.addEventListener('click', () => {
        F.PER_PAGE = parseInt(b.dataset.pp);
        F.page = 1;
        render();
      });
    });

    // применить формат цен к новым узлам
    $$('[data-usd]').forEach(el => { el.textContent = fmt(parseFloat(el.dataset.usd)); });
    // восстановить звёзды
    GS.state.wish.forEach(id => {
      const item = $(`.item[data-game-id="${id}"] .star`);
      if (item){ item.classList.add('on'); item.textContent = '★'; }
    });
  }

  /* ── Сброс фильтров ── */
  const clearAll = () => {
    F.platform.clear(); F.genre.clear(); F.type.clear(); F.region.clear();
    F.priceFrom = F.priceTo = null; F.sale = false;
    $('#pFrom').value = ''; $('#pTo').value = '';
    $('#chipSale').classList.remove('on');
    $$('#rail .chip.on').forEach(c => c.classList.remove('on'));
    $$('#rail .fam__btn .dot').forEach(d => d.remove());
    F.page = 1;
    render();
    syncClone();
  };
  $('#railClear').addEventListener('click', clearAll);
  $('#emptyClear').addEventListener('click', clearAll);

  /* ── Мобильное меню: клон фильтров + ссылки ── */
  const clone = $('#rail').cloneNode(true);
  clone.removeAttribute('id');
  clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id')); // ← фикс: дубликаты id ломают документ
  clone.classList.remove('rail');
  clone.classList.add('rail-clone');
  $('#sheetBody').appendChild(clone);
  bindClone(clone);

  $('#sheetApply').addEventListener('click', () => {
    $('#sheetX').click();
  });

  /* ── Счётчики на аккордеонах ── */
  const refreshCounts = () => {
    $$('#rail .fam').forEach(f => {
      const n = f.querySelectorAll('.chip.on').length;
      f.classList.toggle('has-sel', n > 0);
      let dot = f.querySelector('.fam__btn .dot');
      if (n > 0 && !dot){
        dot = document.createElement('span');
        dot.className = 'dot';
        f.querySelector('.fam__btn').prepend(dot);
      }
      if (dot){ dot.textContent = n; if (!n) dot.remove(); }
    });
  };
  const origObserver = new MutationObserver(refreshCounts);
  origObserver.observe($('#rail'), { subtree: true, attributes: true, attributeFilter: ['class'] });

  /* Плюс → корзина */
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-cart-add]');
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    GS.cartAdd(parseInt(btn.dataset.cartAdd));
    toast(lang() === 'ru' ? 'Добавлено в корзину' : 'Added to cart');
  }, true);

  syncPriceSym();
  render();
})();
</script>
</body>
</html>
